  var PAK = "chicken-road-2.pak";          // null або ім'я сайдкар-файлу

  function xorshift(seed, n) {
    var out = new Uint8Array(n), x = seed >>> 0 || 0x9E3779B9;
    for (var i = 0; i < n; i++) {
      x ^= (x << 13); x >>>= 0;
      x ^= (x >>> 17);
      x ^= (x << 5);  x >>>= 0;
      out[i] = (x >>> 24) & 0xFF;
    }
    return out;
  }
  function b64(s) {
    var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  async function sha256hex(s) {
    var d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [].map.call(new Uint8Array(d), function (b) {
      return b.toString(16).padStart(2, "0");
    }).join("");
  }
  function fail(msg) {
    document.documentElement.innerHTML =
      '<style>body{margin:0;height:100vh;display:flex;align-items:center;' +
      'justify-content:center;background:#12141a;color:#8b93a7;' +
      'font:14px/1.6 system-ui,sans-serif;text-align:center;padding:24px}</style>' +
      // авторство лишається у HTML-коментарі та window.__pf, але не на екрані
      '<body><div><b style="color:#c9d1e3">Demo unavailable</b><br>' + msg + '</div>';
  }

  function hostOf(u) {
    try { return new URL(u).hostname; } catch (e) { return ""; }
  }
  // Гейт по location.hostname НЕ ловить вбудовування: у чужому iframe
  // hostname лишається нашим. Тому окремо звіряємо, хто нас вбудував.
  async function embedOk() {
    if (self === top) return true;
    // свій же сайт: доступ до top.location можливий лише при однаковому origin.
    // Порівнюємо саме origin, не hostname: інакше сусідній ПОРТ на тому ж хості
    // (127.0.0.1:8973 проти :8972) вважався б своїм.
    try { if (top.location.origin === location.origin) return true; } catch (e) {}
    var ao = location.ancestorOrigins;
    var outer = ao && ao.length ? hostOf(ao[ao.length - 1]) : hostOf(document.referrer);
    if (!outer) return false;                       // джерело невідоме — не ризикуємо
    var h = await sha256hex(outer + "|" + W.salt);
    return HOSTS.indexOf(h.slice(0, 16)) >= 0;
  }

  async function boot() {
    var host = location.hostname || "";
    var gate = await sha256hex(host + "|" + W.salt);
    if (HOSTS.indexOf(gate.slice(0, 16)) < 0) {
      return fail("This build is bound to its original host.");
    }
    if (!(await embedOk())) {
      return fail("Embedding from another site is not allowed.");
    }
    // ключ — від PRIMARY, а не від поточного хоста: інакше працював би
    // лише один хост зі списку дозволених
    var keyHex = await sha256hex(W.salt + "|" + W.slug + "|" + PRIMARY);
    var seed = parseInt(keyHex.slice(0, 8), 16);

    var parts = [b64(INLINE)];
    if (PAK) {
      var r = await fetch(PAK, { cache: "no-store" });
      if (!r.ok) return fail("Missing runtime data.");
      parts.push(new Uint8Array(await r.arrayBuffer()));
    }
    var total = parts.reduce(function (n, p) { return n + p.length; }, 0);
    var enc = new Uint8Array(total), off = 0;
    parts.forEach(function (p) { enc.set(p, off); off += p.length; });

    var ks = xorshift(seed, enc.length);
    for (var i = 0; i < enc.length; i++) enc[i] ^= ks[i];

    var raw;
    if (typeof DecompressionStream === "function") {
      var ds = new DecompressionStream("deflate");
      var stream = new Blob([enc]).stream().pipeThrough(ds);
      raw = await new Response(stream).text();
    } else {
      return fail("Browser too old for this demo.");
    }
    if (raw.slice(0, 15).toLowerCase().indexOf("<!doctype html") < 0) {
      return fail("Integrity check failed.");
    }
    window.__pf = W;
    document.open(); document.write(raw); document.close();
  }
  boot().catch(function (e) {
    fail(location.search.indexOf("pfdebug") > 0 ? String(e && e.message || e) : "Load error.");
  });
